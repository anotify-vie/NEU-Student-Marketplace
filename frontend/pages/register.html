<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create an Account | NEU Student Marketplace</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/responsive.css">
  </head>
  <body data-page="register" data-root="..">
    <header class="site-header" id="site-header"></header>
    <main class="site-main auth-main">
      <section class="auth-card" aria-labelledby="form-title">
        <div class="auth-art" role="img" aria-label="A sunny university campus">
          <div>
            <p class="section-kicker">Your campus. Your community.</p>
            <h2>Good finds.<br>New beginnings.</h2>
            <p>Give your student essentials a second life.</p>
          </div>
        </div>
        <div class="auth-content">
          <a class="auth-brand" href="../index.html">NEU Student Marketplace</a>
          <h1 id="form-title">Create an Account</h1>
          <p class="form-intro">Join the NEU student community.</p>
          <form id="page-form" novalidate>
            <div class="form-field">
              <label for="display_name">Full Name</label>
              <input id="display_name" name="display_name" type="text" required autocomplete="name" maxlength="80">
              <small id="display_name-error" class="field-error" role="alert"></small>
            </div>
            <div class="form-field">
              <label for="email">Student Email</label>
              <input id="email" name="email" type="email" required autocomplete="email" maxlength="254" placeholder="e.g. student@example.com">
              <small id="email-error" class="field-error" role="alert"></small>
            </div>
            <div class="form-field">
              <label for="password">Password</label>
              <div class="password-input">
                <input id="password" name="password" type="password" required autocomplete="new-password" minlength="8">
                <button type="button" class="password-toggle" aria-controls="password" aria-label="Show password" aria-pressed="false">Show</button>
              </div>
              <small id="password-error" class="field-error" role="alert"></small>
            </div>
            <div class="form-field">
              <label for="confirm_password">Confirm Password</label>
              <div class="password-input">
                <input id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password">
                <button type="button" class="password-toggle" aria-controls="confirm_password" aria-label="Show confirm password" aria-pressed="false">Show</button>
              </div>
              <small id="confirm_password-error" class="field-error" role="alert"></small>
            </div>
            <p id="form-message" class="form-message" role="status" tabindex="-1"></p>
            <button class="button button-primary submit-button" type="submit">Sign Up</button>
          </form>
          <p class="auth-switch">Already have an account? <a id="auth-switch" href="login.html">Log In</a>
          </p>
        </div>
      </section>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <script type="module" src="../js/forms.js"></script>
  </body>
</html>
