<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search second-hand items from the NEU student community.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <title>Search Results | NEU Student Marketplace</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="search" data-root="..">
  <header class="site-header" id="site-header"></header>
  <main class="site-main catalog-main">
    <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="../index.html">Home</a><span aria-hidden="true">›</span><span aria-current="page">Search Results</span></nav>
    <div class="catalog-layout">
      <aside class="filter-sidebar" aria-label="Search filters">
        <details class="filter-disclosure" open><summary><span>Filters</span><span class="filter-chevron" aria-hidden="true">⌄</span></summary><div id="filters"></div></details>
      </aside>
      <section class="catalog-content" aria-labelledby="catalog-title">
        <div class="catalog-toolbar"><div><p class="section-kicker">Explore the marketplace</p><h1 id="catalog-title">Search Results <span id="query-label"></span> <span id="result-count" class="result-count"></span></h1></div><div class="toolbar-actions"><form class="search-form toolbar-search" action="search.html" method="get" role="search"><label class="sr-only" for="results-search">Search products</label><input id="results-search" type="search" name="q" placeholder="Search products..."><button type="submit" aria-label="Search products">⌕</button></form><label class="sort-label" for="sort-select">Sort by <select id="sort-select" name="sort"><option value="newest">Newest</option><option value="price_asc">Price: Low to High</option><option value="price_desc">Price: High to Low</option></select></label></div></div>
        <div id="catalog-status" class="content-status" role="status">Searching listings…</div>
        <div id="product-grid" class="product-grid catalog-grid" aria-live="polite"></div>
        <div id="empty-state" class="empty-state" hidden><div class="empty-icon" aria-hidden="true">⌕</div><h2>No matching items found</h2><p>Try a different search term or adjust your filters.</p><button class="button button-primary" id="clear-empty" type="button">Clear Filters</button></div>
      </section>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script type="module" src="../js/catalog.js"></script>
</body>
</html>
