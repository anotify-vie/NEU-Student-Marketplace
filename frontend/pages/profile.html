<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="View a NEU Student Marketplace member's public profile.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <title>Profile | NEU Student Marketplace</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/detail-profile.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="profile" data-root="..">
  <header class="site-header" id="site-header"></header>
  <main class="site-main profile-main">
    <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="../index.html">Home</a><span aria-hidden="true">›</span><span aria-current="page">Profile</span></nav>
    <div id="profile-status" class="content-status" role="status">Loading profile…</div>
    <section id="profile-error" class="page-error" hidden><div class="page-error-icon" aria-hidden="true">○</div><h1>Profile unavailable</h1><p id="profile-error-message">This profile could not be found.</p><div class="page-error-actions"><button id="profile-retry" class="button button-outline" type="button">Retry</button><a class="button button-primary" href="browse.html">Browse Products</a></div></section>
    <div id="profile-content" hidden>
      <section class="profile-header" aria-labelledby="profile-name"><div class="profile-cover" role="img" aria-label="Illustration of a leafy university campus"></div><div class="profile-header-body"><div id="profile-avatar" class="profile-avatar profile-avatar-large" aria-hidden="true"></div><div class="profile-heading"><p class="section-kicker">NEU community member</p><h1 id="profile-name"></h1><p id="profile-subtitle"></p></div><button id="edit-profile-button" class="button button-outline" type="button" hidden>Edit Profile</button></div></section>
      <section class="profile-stats" aria-label="Listing statistics"><div><strong id="stat-total">—</strong><span>Listings</span></div><div><strong id="stat-available">—</strong><span>On Sale</span></div><div><strong id="stat-reserved">—</strong><span>Reserved</span></div><div><strong id="stat-sold">—</strong><span>Sold</span></div></section>
      <div class="profile-columns"><section class="profile-panel" aria-labelledby="about-title"><h2 id="about-title">About</h2><p id="profile-bio"></p></section><section class="profile-panel" aria-labelledby="information-title"><h2 id="information-title">Student Information</h2><dl class="information-list"><div><dt>Faculty</dt><dd id="profile-faculty"></dd></div><div><dt>Cohort</dt><dd id="profile-cohort"></dd></div><div><dt>Campus</dt><dd id="profile-campus"></dd></div><div><dt>Member Since</dt><dd id="profile-joined"></dd></div></dl></section></div>
      <section id="edit-panel" class="profile-panel edit-panel" aria-labelledby="edit-title" hidden><div class="edit-heading"><div><p class="section-kicker">Your account</p><h2 id="edit-title">Edit Profile</h2></div><button id="cancel-edit-top" class="text-link plain-button" type="button">Cancel</button></div><form id="profile-form" novalidate><div class="edit-grid"><div class="form-field"><label for="edit-name">Full Name</label><input id="edit-name" name="display_name" type="text" maxlength="80" required><small id="name-error" class="field-error" role="alert"></small></div><div class="form-field"><label for="edit-faculty">Faculty</label><input id="edit-faculty" name="faculty" type="text" maxlength="80" required><small id="faculty-error" class="field-error" role="alert"></small></div><div class="form-field"><label for="edit-cohort">Cohort</label><input id="edit-cohort" name="cohort" type="text" maxlength="12" placeholder="e.g. K64" required><small id="cohort-error" class="field-error" role="alert"></small></div><div class="form-field form-field-wide"><label for="edit-bio">About You</label><textarea id="edit-bio" name="bio" rows="4" maxlength="300" placeholder="Tell fellow students a little about yourself."></textarea><small id="bio-error" class="field-error" role="alert"></small></div></div><div class="form-actions"><button class="button button-primary" type="submit">Save Changes</button><button id="cancel-edit" class="button button-outline" type="button">Cancel</button></div></form></section>
      <p id="profile-message" class="profile-message" role="status"></p>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script type="module" src="../js/profile.js"></script>
</body>
</html>
